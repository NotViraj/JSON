<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="abc"></p>
    <script>
        function abcd(add) {
            document.getElementById("abc").innerHTML = add;
        }
        function efgh(a,b) {
            let ans = a + b;
            abcd(ans);
        }
        let myPromise = new Promise(function(myResolve, myReject) {
            let x = 5;
            if (x == 5) {
                myResolve("OK");
            } else {
                myReject("Error");
            }
        });
        myPromise.then(
            function(value) {
                efgh(5, 10);
            },
            function(error) {
                abcd(error);
            }
        );

    </script>
</body>
</html>
