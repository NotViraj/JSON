<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Async/Await in JS</h1>
    <p id="abc"></p>
    <script>
        function abcd(add) {
            document.getElementById("abc").innerHTML = add;
        }
        async function efgh(a,b) {
            let ans = await a + b;
            abcd(ans);
        }
        efgh(5, 10);
    </script>
</body>
</html>
